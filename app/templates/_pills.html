{# A status pill: an icon AND text, so the meaning never depends on color alone #}
{% macro status_pill(status) %}
{% set icons = {"Open": "○", "In Progress": "◐", "Resolved": "✓", "Closed": "■"} %}
<span class="pill pill-status-{{ status|lower|replace(' ', '-') }}"><span class="pill-icon" aria-hidden="true">{{ icons.get(status, "•") }}</span>{{ status }}</span>
{% endmacro %}
