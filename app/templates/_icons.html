{# Small inline icons. Usage: {{ icon("grid") }}. They are decorative (aria-hidden). #}
{% macro icon(name) %}
<svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == "grid" %}
  <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
  <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
  {% elif name == "list" %}
  <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
  {% elif name == "plus" %}
  <path d="M12 5v14M5 12h14"/>
  {% elif name == "logout" %}
  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
  {% elif name == "menu" %}
  <path d="M4 6h16M4 12h16M4 18h16"/>
  {% elif name == "close" %}
  <path d="M6 6l12 12M18 6L6 18"/>
  {% endif %}
</svg>
{% endmacro %}

{# The Helpticketer logo mark #}
{% macro logo() %}
<svg class="logo" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" focusable="false">
  <rect width="32" height="32" rx="9" fill="#c8472a"/>
  <path d="M10 9v14M22 9v14M10 16h12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
</svg>
{% endmacro %}
