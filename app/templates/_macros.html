{# A reusable piece: one form field with its label and error messages #}
{% macro render_field(field, testid) %}
<div class="field">
  {{ field.label }}
  {{ field(class_="input", data_testid=testid) }}
  {% if field.errors %}
  <ul class="field-errors" role="alert">
    {% for error in field.errors %}
    <li>{{ error }}</li>
    {% endfor %}
  </ul>
  {% endif %}
</div>
{% endmacro %}
